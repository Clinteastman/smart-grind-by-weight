name: Firmware

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'media/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'media/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: Waveshare 1.64 V1
            variant: v1
          - board: Waveshare 1.64 V2
            variant: v2

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run firmware host regression tests
        run: python -m unittest discover -s tools/tests -p '*_test.py'

      - name: Test embedded settings save workflow
        run: node tools/tests/settings_web_test.mjs

      - name: Test embedded firmware update feedback
        run: node tools/tests/ota_web_test.mjs

      - name: Restore managed component cache
        uses: actions/cache@v5
        with:
          path: managed_components
          key: ${{ runner.os }}-idf-components-${{ hashFiles('src/idf_component.yml') }}
          restore-keys: |
            ${{ runner.os }}-idf-components-

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          extra_docker_args: -e SMART_GRIND_BUILD_NUMBER=${{ github.run_number }}
          command: python3 tools/grinder.py build --hardware ${{ matrix.variant }}

      - name: Prepare test firmware
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p test-firmware
          cp "build/${{ matrix.variant }}/smart-grind-by-weight.bin" \
            "test-firmware/smart-grind-by-weight-pr${{ github.event.pull_request.number }}-${{ matrix.variant }}.bin"

      - name: Upload test firmware
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: smart-grind-by-weight-pr${{ github.event.pull_request.number }}-${{ matrix.variant }}
          path: test-firmware/*.bin
          if-no-files-found: error
          retention-days: 7
