name: Firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: Waveshare 1.64 V1
            environment: waveshare-esp32s3-touch-amoled-164
          - board: Waveshare 1.64 V2
            environment: waveshare-esp32s3-touch-amoled-164-v2
    env:
      SMART_GRIND_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}
