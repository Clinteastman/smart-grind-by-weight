name: Firmware

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'media/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'media/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: Waveshare 1.64 V1
            environment: waveshare-esp32s3-touch-amoled-164
            variant: v1
          - board: Waveshare 1.64 V2
            environment: waveshare-esp32s3-touch-amoled-164-v2
            variant: v2
    env:
      SMART_GRIND_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Restore PlatformIO package cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-deps-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-deps-

      - name: Restore compiled-object cache
        uses: actions/cache@v5
        with:
          path: .pio/build-cache/${{ matrix.environment }}
          key: ${{ runner.os }}-pio-objects-${{ matrix.environment }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-pio-objects-${{ matrix.environment }}-
            ${{ runner.os }}-pio-objects-

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Run firmware host regression tests
        run: python -m unittest discover -s tools/tests -p '*_test.py'

      - name: Test embedded settings save workflow
        run: node tools/tests/settings_web_test.mjs

      - name: Build firmware
        env:
          PLATFORMIO_BUILD_CACHE_DIR: .pio/build-cache/${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

      - name: Prepare test firmware
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p test-firmware
          cp ".pio/build/${{ matrix.environment }}/firmware.bin" \
            "test-firmware/smart-grind-by-weight-pr${{ github.event.pull_request.number }}-${{ matrix.variant }}.bin"

      - name: Upload test firmware
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: smart-grind-by-weight-pr${{ github.event.pull_request.number }}-${{ matrix.variant }}
          path: test-firmware/*.bin
          if-no-files-found: error
          retention-days: 7
