name: Bug Report
description: Report a bug or issue with the Smart Grind-by-Weight system
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue! Please fill out the information below to help us diagnose and fix the problem.

  - type: checkboxes
    id: diagnostic-report
    attributes:
      label: Diagnostic Report
      description: Please generate and attach a diagnostic report from your device. This is **required** for most hardware/firmware issues.
      options:
        - label: I have attached the diagnostic log, or explained below why it is unavailable
          required: true

  - type: markdown
    attributes:
      value: |
        ### How to Get a Diagnostic Report

        **For grind-related issues (accuracy, timeout, pulse corrections, etc.):**
        1. **Enable history:** Web UI → Settings → Grinding → Save grind history
        2. **Capture the issue:** Perform at least one grind where the issue occurs
        3. **Generate diagnostics:** Follow one of the methods below

        The diagnostic report will automatically include your recent grind results, which is critical for troubleshooting grind behavior.

        ---

        **Option 1: Grinder web UI (Recommended)**
        1. Open `http://smartgrind.local` or the IP shown on the grinder
        2. Open **Settings → System & updates**
        3. Select **Refresh** under Recent diagnostic log
        4. Copy the log, or select **Download** and attach the file

        **Option 2: Bluetooth / command line fallback**
        ```bash
        python3 tools/grinder.py diagnostics --save diagnostics.txt
        ```
        Then attach the `diagnostics.txt` file to this issue.

  - type: textarea
    id: diagnostic-output
    attributes:
      label: Diagnostic Report Output
      description: Paste the complete diagnostic report here
      placeholder: |
        === DIAGNOSTIC REPORT ===
        [Paste your full diagnostic report here]
        === END OF REPORT ===
      render: text
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Issue Description
      description: Describe what happened, what you expected to happen, and how to reproduce it
      placeholder: |
        **What happened?**
        [Describe the issue you're experiencing]

        **What did you expect to happen?**
        [Describe the expected behavior]

        **Steps to Reproduce (optional):**
        1. Go to '...'
        2. Click on '...'
        3. See error

        Include any error messages, unexpected behavior, or accuracy issues.
    validations:
      required: true

  - type: input
    id: firmware-version
    attributes:
      label: Firmware Version
      description: Shown in Web UI → Settings → System & updates
      placeholder: "For example: 1.5.1 Build 1"
    validations:
      required: true

  - type: dropdown
    id: controller-revision
    attributes:
      label: Controller Revision
      description: Select the firmware/hardware target installed on the Waveshare controller
      options:
        - V1
        - V2
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: grinder-model
    attributes:
      label: Grinder Model
      description: What grinder are you using?
      options:
        - Eureka Mignon Specialita
        - Eureka Mignon XL
        - Eureka Mignon Silenzio
        - Eureka Mignon Crono
        - Eureka Mignon Manuale
        - Eureka Mignon Zero
        - Eureka Atom series
        - Baratza (specify model below)
        - Niche Zero
        - Mazzer (specify model below)
        - Other (specify below)
    validations:
      required: true

  - type: dropdown
    id: modifications
    attributes:
      label: Modifications
      description: Have you made any modifications to the grinder hardware, 3D printed parts, or smart-grind-by-weight firmware/software?
      options:
        - No modifications (stock setup)
        - Yes (details below)
    validations:
      required: true

  - type: textarea
    id: modifications-details
    attributes:
      label: Modification Details
      description: If you selected "Yes" above, please describe your modifications
      placeholder: |
        **Hardware modifications:**
        - [e.g., custom motor control, sensor changes, wiring modifications, etc.]

        **3D design/parts modifications:**
        - [e.g., custom enclosure, modified mounting, different display holder, etc.]

        **Firmware/software modifications:**
        - [e.g., code changes, parameter adjustments, algorithm tweaks, custom build, etc.]
        - Include commit hash or fork URL if applicable
    validations:
      required: false

  - type: textarea
    id: hardware-setup
    attributes:
      label: Hardware Setup
      description: Describe your hardware configuration
      placeholder: |
        - Display: Waveshare ESP32-S3 1.64" AMOLED
        - Load cell: 1kg / 300g / other
        - HX711 board: Generic / Sparkfun / other
        - Any modifications or custom wiring
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
      placeholder: |
        - Screenshots or photos
        - When did this start happening?
        - Does it happen consistently or intermittently?
        - Any recent changes to your setup?
    validations:
      required: false
